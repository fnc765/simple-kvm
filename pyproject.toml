[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-kvm"
version = "0.1.0"
description = "DIY KVM switch with BluePill + Python GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "fnchoco"},
]
keywords = ["kvm", "bluepill", "stm32", "usb-hid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PySide6>=6.6.0,<7.0.0",
    "pyserial>=3.5,<4.0.0",
    "av>=13.0,<15.0.0",
    "pygrabber>=0.2,<1.0.0",
    "pykakasi>=2.3.0,<3.0.0",
]

[project.scripts]
simple-kvm = "app.main:main"

[project.gui-scripts]
simple-kvm-gui = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.ui"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10.0.0",
]
build = [
    "pyinstaller>=6.0,<7.0.0",
    "pyinstaller-hooks-contrib>=2024.0,<2027.0",
]

[tool.pyinstaller]
# PyInstaller base settings (overridden by .spec file for complex builds)
scripts = ["app/__main__.py"]
name = "simple-kvm"
onefile = false
windowed = true
noupx = true
clean = true

[tool.pytest.ini_options]
testpaths = ["tests"]
